spring:
  datasource:
    url: jdbc:h2:mem:productdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

app:
  jwt:
    secret: 2F4A7D9C1E8B3F6A0C5D2E9B7A4F1C8E3D6B0A9F5C2E7D1B4A8C3F6E0D9B2A
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  security:
    require-https: false
  cors:
    allowed-origins: "*"
  seed:
    admin-username: admin
    admin-password: Admin@123
    admin-email: admin@zestindia.local
    user-username: user
    user-password: User@123
    user-email: user@zestindia.local
