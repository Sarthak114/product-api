services:
  mysql:
    image: mysql:8.0
    container_name: product-api-mysql
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: zest
      MYSQL_PASSWORD: zestpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uzest", "-pzestpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/productdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: zest
      SPRING_DATASOURCE_PASSWORD: zestpass
      APP_JWT_SECRET: 2F4A7D9C1E8B3F6A0C5D2E9B7A4F1C8E3D6B0A9F5C2E7D1B4A8C3F6E0D9B2A
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
